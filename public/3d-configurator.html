<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caxra 3D Product Configurator</title>
<style>
html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: transparent !important;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
#view {
  position: absolute;
  inset: 0;
  cursor: grab;
}
#view:active {
  cursor: grabbing;
}
canvas {
  display: block;
  touch-action: pan-y;
}
</style>
</head>
<body>
<div id="view"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
const host = document.getElementById('view');
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 50);
const home = new THREE.Vector3(3.2, 2.0, 3.5);
camera.position.copy(home);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
host.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.65, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.85;
controls.enableZoom = false; // Prevents page scroll hijacking
controls.enablePan = false;
controls.maxPolarAngle = Math.PI / 2 + 0.03;
controls.minPolarAngle = Math.PI / 5;

// Studio Lighting Setup
scene.add(new THREE.HemisphereLight(0xffffff, 0xd8d3cc, 0.95));

const keyLight = new THREE.DirectionalLight(0xffffff, 0.9);
keyLight.position.set(4, 7, 5);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xfff5ea, 0.55);
fillLight.position.set(-4, 4, 3);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffe8d6, 0.35);
rimLight.position.set(0, 5, -4);
scene.add(rimLight);

const W = 1.2, H = 1.3, D = 1.0, base = 0.14;
const cream = new THREE.MeshStandardMaterial({ color: 0xf8f7f5, roughness: 0.42, metalness: 0.12 });
const side = new THREE.MeshStandardMaterial({ color: 0xd9d6d0, roughness: 0.45, metalness: 0.22 });
const dark = new THREE.MeshStandardMaterial({ color: 0x1a1d24, roughness: 0.85 });
const metal = new THREE.MeshStandardMaterial({ color: 0xc8cbd2, roughness: 0.28, metalness: 0.85 });

// Machine Group that scales dynamically
const cab = new THREE.Group();
scene.add(cab);

// Body footprint
const s = new THREE.Shape();
[[-.6,-.5],[.6,-.5],[.6,.3],[.2,.3],[.2,.15],[-.2,.15],[-.2,.3],[-.6,.3]].forEach((p,i)=>{
  i ? s.lineTo(p[0], -p[1]) : s.moveTo(p[0], -p[1]);
});
const g = new THREE.ExtrudeGeometry(s, { depth: H - base, bevelEnabled: false });
g.rotateX(-Math.PI / 2);
const body = new THREE.Mesh(g, side);
body.position.y = base;
cab.add(body);

const edges = new THREE.LineSegments(
  new THREE.EdgesGeometry(g), 
  new THREE.LineBasicMaterial({ color: 0x7a7774, transparent: true, opacity: 0.55 })
);
edges.position.y = base;
cab.add(edges);

// Top plate
const tg = new THREE.ExtrudeGeometry(s, { depth: .012, bevelEnabled: false });
tg.rotateX(-Math.PI / 2);
const top = new THREE.Mesh(tg, cream);
top.position.y = H;
cab.add(top);

// Recessed front panel
const panel = new THREE.Mesh(new THREE.PlaneGeometry(.4, H - base), cream);
panel.position.set(0, base + (H - base) / 2, .1505);
cab.add(panel);

[-.2, .2].forEach(x => {
  const st = new THREE.Mesh(new THREE.BoxGeometry(.03, H - base, .16), side);
  st.position.set(x, base + (H - base) / 2, .23);
  cab.add(st);
});

[-.4, .4].forEach(x => {
  const f = new THREE.Mesh(new THREE.PlaneGeometry(.4, H - base), cream);
  f.position.set(x, base + (H - base) / 2, .3005);
  cab.add(f);
});

// Dynamic Logo & Model Canvas Texture
const c = document.createElement('canvas');
c.width = 512;
c.height = 640;
const ctx = c.getContext('2d');
const img = new Image();

let currentModelName = 'CMS-OWC-050';
let currentCapacityText = '50 kg / day';

function renderTexture() {
  ctx.clearRect(0, 0, 512, 640);

  // Clean white card background
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  if (ctx.roundRect) {
    ctx.roundRect(40, 20, 432, 600, 24);
  } else {
    ctx.rect(40, 20, 432, 600);
  }
  ctx.fill();
  ctx.strokeStyle = '#e2e8f0';
  ctx.lineWidth = 4;
  ctx.stroke();

  // Logo image
  try {
    if (img.complete && img.naturalWidth !== 0) {
      ctx.drawImage(img, 146, 50, 220, 220);
    }
  } catch(e) {}

  // Brand Name
  ctx.fillStyle = '#ff7026';
  ctx.font = '800 68px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Caxra', 256, 325);

  ctx.fillStyle = '#1f2853';
  ctx.font = '700 28px system-ui, sans-serif';
  ctx.fillText('MACHINE SYSTEMS', 256, 370);

  // Accent divider line
  ctx.strokeStyle = '#ff7026';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(110, 400);
  ctx.lineTo(402, 400);
  ctx.stroke();

  // Model Name pill
  ctx.fillStyle = '#1f2853';
  ctx.beginPath();
  if (ctx.roundRect) {
    ctx.roundRect(70, 425, 372, 64, 12);
  } else {
    ctx.rect(70, 425, 372, 64);
  }
  ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.font = '800 32px monospace';
  ctx.fillText(currentModelName, 256, 469);

  // Capacity subtitle
  ctx.fillStyle = '#ff7026';
  ctx.font = '700 30px system-ui, sans-serif';
  ctx.fillText(currentCapacityText, 256, 538);

  ctx.fillStyle = '#64748b';
  ctx.font = '600 22px system-ui, sans-serif';
  ctx.fillText('SS 304 HEAVY DUTY', 256, 580);

  if (tex) tex.needsUpdate = true;
}

const tex = new THREE.CanvasTexture(c);
img.onload = () => { renderTexture(); };
img.src = '/caxra-logo.png';

const logo = new THREE.Mesh(new THREE.PlaneGeometry(.34, .44), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
logo.position.set(0, .75, .152);
cab.add(logo);

// Chute opening + tray
const hole = new THREE.Mesh(new THREE.PlaneGeometry(.2, .26), dark);
hole.position.set(0, .3, .152);
cab.add(hole);

const tray = new THREE.Mesh(new THREE.BoxGeometry(.19, .012, .2), metal);
tray.position.set(0, .3, .24);
tray.rotation.x = .45;
cab.add(tray);

// Hopper opening under lid
const open = new THREE.Mesh(new THREE.PlaneGeometry(.6, .5), dark);
open.rotation.x = -Math.PI / 2;
open.position.set(0, H + .013, -.15);
cab.add(open);

const hinge = new THREE.Group();
hinge.position.set(0, H + .016, -.4);
cab.add(hinge);

const lid = new THREE.Mesh(new THREE.BoxGeometry(.62, .012, .52), cream);
lid.position.z = .26;
hinge.add(lid);

// Handle
const bar = new THREE.Mesh(new THREE.CylinderGeometry(.009, .009, .16, 12), metal);
bar.rotation.z = Math.PI / 2;
bar.position.set(.1, .055, .4);
hinge.add(bar);

[.02, .18].forEach(dx => {
  const p = new THREE.Mesh(new THREE.CylinderGeometry(.009, .009, .05, 12), metal);
  p.position.set(dx, .03, .4);
  hinge.add(p);
});

// Casters
[[-.5,-.4],[.5,-.4],[-.5,.22],[.5,.22]].forEach(p => {
  const br = new THREE.Mesh(new THREE.BoxGeometry(.14, .025, .14), cream);
  br.position.set(p[0], base - .01, p[1]);
  cab.add(br);
  const w = new THREE.Mesh(new THREE.CylinderGeometry(.05, .05, .03, 20), new THREE.MeshStandardMaterial({ color: 0x4a4d52, roughness: .5 }));
  w.rotation.z = Math.PI / 2;
  w.position.set(p[0], .05, p[1]);
  cab.add(w);
  const f = new THREE.Mesh(new THREE.BoxGeometry(.05, .07, .05), metal);
  f.position.set(p[0], .09, p[1]);
  cab.add(f);
});

// Soft diffused floor shadow
const shadowCanvas = document.createElement('canvas');
shadowCanvas.width = 256;
shadowCanvas.height = 256;
const sctx = shadowCanvas.getContext('2d');
const gradient = sctx.createRadialGradient(128, 128, 10, 128, 128, 120);
gradient.addColorStop(0, 'rgba(40, 25, 15, 0.35)');
gradient.addColorStop(0.4, 'rgba(60, 35, 20, 0.18)');
gradient.addColorStop(0.7, 'rgba(80, 45, 25, 0.06)');
gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
sctx.fillStyle = gradient;
sctx.fillRect(0, 0, 256, 256);

const shadowTex = new THREE.CanvasTexture(shadowCanvas);
const shadowGeo = new THREE.PlaneGeometry(2.4, 2.2);
const shadowMat = new THREE.MeshBasicMaterial({
  map: shadowTex,
  transparent: true,
  depthWrite: false
});
const softShadow = new THREE.Mesh(shadowGeo, shadowMat);
softShadow.rotation.x = -Math.PI / 2;
softShadow.position.set(0, 0.001, -0.05);
scene.add(softShadow);

// Dynamic Scaling by Capacity Target
const targetScale = new THREE.Vector3(1, 1, 1);
const shadowTargetScale = new THREE.Vector3(1, 1, 1);
let targetLookY = 0.65;

function applyCapacity(capData) {
  if (!capData) return;
  const sx = capData.sx || 1;
  const sy = capData.sy || 1;
  const sz = capData.sz || 1;

  targetScale.set(sx, sy, sz);
  shadowTargetScale.set(sx * 1.05, sz * 1.05, 1);
  targetLookY = 0.65 * Math.min(1.4, sy);

  if (capData.model) {
    currentModelName = capData.model;
  }
  if (capData.capacity) {
    currentCapacityText = capData.capacity;
  }
  renderTexture();

  // If camera is too close for large sizes, push camera back gently
  const maxDim = Math.max(sx, sy, sz);
  const minRequiredDistance = 2.4 * Math.max(1, maxDim * 0.7);
  const currentDist = camera.position.distanceTo(controls.target);
  if (currentDist < minRequiredDistance) {
    const dir = camera.position.clone().sub(controls.target).normalize();
    camera.position.copy(controls.target).add(dir.multiplyScalar(minRequiredDistance));
  }
}

// Lid state
let targetLid = 0, curLid = 0;

function toggleLidAction() {
  targetLid = targetLid ? 0 : -1.9;
}

function resetViewAction() {
  camera.position.copy(home);
  controls.target.set(0, 0.65, 0);
}

// Window Message Listener from React Parent Component
window.addEventListener('message', function(e) {
  if (!e.data) return;
  if (e.data.type === 'SET_CAPACITY') {
    applyCapacity(e.data);
  } else if (e.data.type === 'TOGGLE_LID') {
    toggleLidAction();
  } else if (e.data.type === 'TOGGLE_ROTATE') {
    controls.autoRotate = !controls.autoRotate;
  } else if (e.data.type === 'RESET_VIEW') {
    resetViewAction();
  } else if (e.data.type === 'SET_VIEW') {
    if (e.data.view === 'front') {
      camera.position.set(0, 0.7 * targetScale.y, 4.0 * Math.max(0.85, targetScale.z * 0.9));
      controls.target.set(0, 0.65 * targetScale.y, 0);
    } else if (e.data.view === 'iso') {
      camera.position.set(3.2, 2.0, 3.5);
      controls.target.set(0, 0.65 * targetScale.y, 0);
    } else if (e.data.view === 'top') {
      camera.position.set(0, 4.5, 0.3);
      controls.target.set(0, 0, 0);
    }
  }
});

function size() {
  const w = host.clientWidth;
  const h = host.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', size);
size();

(function loop(){
  requestAnimationFrame(loop);
  
  // Smoothly morph/scale machine model to target dimensions
  cab.scale.lerp(targetScale, 0.08);
  softShadow.scale.x += (shadowTargetScale.x - softShadow.scale.x) * 0.08;
  softShadow.scale.y += (shadowTargetScale.y - softShadow.scale.y) * 0.08;

  controls.target.y += (targetLookY - controls.target.y) * 0.08;

  curLid += (targetLid - curLid) * 0.08;
  hinge.rotation.x = curLid;
  
  controls.update();
  renderer.render(scene, camera);
})();
})();
</script>
</body>
</html>
