<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caxra 3D Composter - Waste to Resource</title>
<style>
html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: transparent !important;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
#view {
  position: absolute;
  inset: 0;
  cursor: grab;
}
#view:active {
  cursor: grabbing;
}
canvas {
  display: block;
  touch-action: pan-y;
}

/* Floating Interactive Controls */
.bar {
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 6px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(226, 232, 240, 0.9);
  border-radius: 9999px;
  box-shadow: 0 4px 18px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
  z-index: 20;
  max-width: calc(100vw - 24px);
  flex-wrap: nowrap !important;
  white-space: nowrap;
  user-select: none;
  -webkit-user-select: none;
}
button {
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  padding: 6px 11px;
  border-radius: 9999px;
  border: 1px solid transparent;
  background: transparent;
  color: #475569;
  cursor: pointer;
  transition: all 0.15s ease;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
button svg {
  flex-shrink: 0;
  transition: transform 0.2s ease;
}
button:hover {
  background: rgba(241, 245, 249, 0.9);
  color: #0f172a;
}
button:active {
  transform: scale(0.96);
}
button[aria-pressed="true"] {
  background: #1e293b;
  color: #fff;
  font-weight: 700;
  box-shadow: 0 2px 6px rgba(30, 41, 59, 0.2);
}
button#feed[aria-pressed="true"] {
  background: #059669;
  color: #fff;
  box-shadow: 0 2px 6px rgba(5, 150, 105, 0.25);
}
button#spin[aria-pressed="true"] {
  background: #ff7026;
  color: #fff;
  box-shadow: 0 2px 6px rgba(255, 112, 38, 0.25);
}

.mob-only {
  display: none;
}
.desk-only {
  display: inline;
}

@media (max-width: 520px) {
  .bar {
    bottom: 8px;
    padding: 3px 5px;
    gap: 3px;
  }
  button {
    font-size: 10px;
    padding: 5px 8px;
    gap: 4px;
  }
  button svg {
    width: 12px;
    height: 12px;
  }
  .mob-only {
    display: inline;
  }
  .desk-only {
    display: none;
  }
}


</style>
</head>
<body>
<div id="view"></div>

<!-- Action Controls Bar -->
<div class="bar">
  <button id="feed" aria-pressed="true" title="Toggle Waste Feeding">
    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
    <span class="desk-only" id="feed-txt">Stop Feeding</span>
    <span class="mob-only" id="feed-mob">Feed</span>
  </button>
  <button id="lid" aria-pressed="true" title="Toggle Hopper Lid">
    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/><rect width="20" height="5" x="2" y="17" rx="1"/></svg>
    <span class="desk-only" id="lid-txt">Close Lid</span>
    <span class="mob-only" id="lid-mob">Lid</span>
  </button>
  <button id="spin" aria-pressed="true" title="Toggle 360 Rotation">
    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
    <span class="desk-only">Auto Rotate</span>
    <span class="mob-only">Rotate</span>
  </button>
  <button id="reset" title="Reset Camera View">
    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/></svg>
    <span class="desk-only">Reset View</span>
    <span class="mob-only">Reset</span>
  </button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
const host = document.getElementById('view');
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 50);
const home = new THREE.Vector3(2.35, 1.8, 2.8);
camera.position.copy(home);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setClearColor(0x000000, 0); // Pure transparent
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
host.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.68, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.enableZoom = false; // Disable scroll zoom so page scrolling is completely natural
controls.enablePan = false;
controls.maxPolarAngle = Math.PI / 2 + 0.03;
controls.minPolarAngle = Math.PI / 5;

// Studio Lighting
scene.add(new THREE.HemisphereLight(0xffffff, 0xa8a29a, 0.72));

const keyLight = new THREE.DirectionalLight(0xffffff, 0.72);
keyLight.position.set(4, 7, 5);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xfff5ea, 0.4);
fillLight.position.set(-4, 4, 3);
scene.add(fillLight);

const rimLight = new THREE.DirectionalLight(0xffe8d6, 0.3);
rimLight.position.set(0, 5, -4);
scene.add(rimLight);

const W = 1.2, H = 1.3, D = 1.0, base = 0.14;
const cream = new THREE.MeshStandardMaterial({ color: 0xd5d0c8, roughness: 0.52, metalness: 0.18 });
const side = new THREE.MeshStandardMaterial({ color: 0xaaa59e, roughness: 0.55, metalness: 0.28 });
const dark = new THREE.MeshStandardMaterial({ color: 0x18191c, roughness: 0.85 });
const metal = new THREE.MeshStandardMaterial({ color: 0x9498a0, roughness: 0.32, metalness: 0.85 });

const cab = new THREE.Group();
scene.add(cab);

// Body: footprint with recessed centre front
const s = new THREE.Shape();
[[-.6,-.5],[.6,-.5],[.6,.3],[.2,.3],[.2,.15],[-.2,.15],[-.2,.3],[-.6,.3]].forEach((p,i)=>{
  i ? s.lineTo(p[0], -p[1]) : s.moveTo(p[0], -p[1]);
});
const g = new THREE.ExtrudeGeometry(s, { depth: H - base, bevelEnabled: false });
g.rotateX(-Math.PI / 2);
const body = new THREE.Mesh(g, side);
body.position.y = base;
cab.add(body);

const edges = new THREE.LineSegments(
  new THREE.EdgesGeometry(g), 
  new THREE.LineBasicMaterial({ color: 0x44423f, transparent: true, opacity: 0.65 })
);
edges.position.y = base;
cab.add(edges);

// Top plate
const tg = new THREE.ExtrudeGeometry(s, { depth: .012, bevelEnabled: false });
tg.rotateX(-Math.PI / 2);
const top = new THREE.Mesh(tg, cream);
top.position.y = H;
cab.add(top);

// Recessed front panel
const panel = new THREE.Mesh(new THREE.PlaneGeometry(.4, H - base), cream);
panel.position.set(0, base + (H - base) / 2, .1505);
cab.add(panel);

[-.2, .2].forEach(x => {
  const st = new THREE.Mesh(new THREE.BoxGeometry(.03, H - base, .16), side);
  st.position.set(x, base + (H - base) / 2, .23);
  cab.add(st);
});

[-.4, .4].forEach(x => {
  const f = new THREE.Mesh(new THREE.PlaneGeometry(.4, H - base), cream);
  f.position.set(x, base + (H - base) / 2, .3005);
  cab.add(f);
});

// Front Panel Caxra Logo Badge
const c = document.createElement('canvas');
c.width = 512;
c.height = 640;
const ctx = c.getContext('2d');
const img = new Image();

function renderTexture() {
  ctx.clearRect(0, 0, 512, 640);

  // Clean white card background
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  if (ctx.roundRect) {
    ctx.roundRect(40, 20, 432, 600, 24);
  } else {
    ctx.rect(40, 20, 432, 600);
  }
  ctx.fill();
  ctx.strokeStyle = '#e2e8f0';
  ctx.lineWidth = 4;
  ctx.stroke();

  // Logo image
  try {
    if (img.complete && img.naturalWidth !== 0) {
      ctx.drawImage(img, 146, 50, 220, 220);
    }
  } catch(e) {}

  ctx.fillStyle = '#ff7026';
  ctx.font = '800 68px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Caxra', 256, 325);

  ctx.fillStyle = '#1f2853';
  ctx.font = '700 28px system-ui, sans-serif';
  ctx.fillText('MACHINE SYSTEMS', 256, 370);

  ctx.strokeStyle = '#ff7026';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(110, 400);
  ctx.lineTo(402, 400);
  ctx.stroke();

  ctx.fillStyle = '#1f2853';
  ctx.beginPath();
  if (ctx.roundRect) {
    ctx.roundRect(70, 425, 372, 64, 12);
  } else {
    ctx.rect(70, 425, 372, 64);
  }
  ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.font = '800 30px monospace';
  ctx.fillText('CMS-OWC-SERIES', 256, 469);

  ctx.fillStyle = '#ff7026';
  ctx.font = '700 28px system-ui, sans-serif';
  ctx.fillText('10 - 1000 kg / day', 256, 538);

  ctx.fillStyle = '#64748b';
  ctx.font = '600 22px system-ui, sans-serif';
  ctx.fillText('SS 304 FOOD GRADE', 256, 580);

  if (tex) tex.needsUpdate = true;
}

const tex = new THREE.CanvasTexture(c);
img.onload = () => { renderTexture(); };
img.src = '/caxra-logo.png';

const logo = new THREE.Mesh(new THREE.PlaneGeometry(.34, .44), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
logo.position.set(0, .75, .152);
cab.add(logo);

// Chute opening + tray
const hole = new THREE.Mesh(new THREE.PlaneGeometry(.2, .26), dark);
hole.position.set(0, .3, .152);
cab.add(hole);

const tray = new THREE.Mesh(new THREE.BoxGeometry(.19, .012, .2), metal);
tray.position.set(0, .3, .24);
tray.rotation.x = .45;
cab.add(tray);

// Hopper opening under lid
const open = new THREE.Mesh(new THREE.PlaneGeometry(.6, .5), dark);
open.rotation.x = -Math.PI / 2;
open.position.set(0, H + .013, -.15);
cab.add(open);

const hinge = new THREE.Group();
hinge.position.set(0, H + .016, -.4);
cab.add(hinge);

const lid = new THREE.Mesh(new THREE.BoxGeometry(.62, .012, .52), cream);
lid.position.z = .26;
hinge.add(lid);

// Handle
const bar = new THREE.Mesh(new THREE.CylinderGeometry(.009, .009, .16, 12), metal);
bar.rotation.z = Math.PI / 2;
bar.position.set(.1, .055, .4);
hinge.add(bar);

[.02, .18].forEach(dx => {
  const p = new THREE.Mesh(new THREE.CylinderGeometry(.009, .009, .05, 12), metal);
  p.position.set(dx, .03, .4);
  hinge.add(p);
});

// Casters
[[-.5,-.4],[.5,-.4],[-.5,.22],[.5,.22]].forEach(p => {
  const br = new THREE.Mesh(new THREE.BoxGeometry(.14, .025, .14), cream);
  br.position.set(p[0], base - .01, p[1]);
  cab.add(br);
  const w = new THREE.Mesh(new THREE.CylinderGeometry(.05, .05, .03, 20), new THREE.MeshStandardMaterial({ color: 0x4a4d52, roughness: .5 }));
  w.rotation.z = Math.PI / 2;
  w.position.set(p[0], .05, p[1]);
  cab.add(w);
  const f = new THREE.Mesh(new THREE.BoxGeometry(.05, .07, .05), metal);
  f.position.set(p[0], .09, p[1]);
  cab.add(f);
});

// Soft diffused floor shadow
const shadowCanvas = document.createElement('canvas');
shadowCanvas.width = 256;
shadowCanvas.height = 256;
const sctx = shadowCanvas.getContext('2d');
const gradient = sctx.createRadialGradient(128, 128, 10, 128, 128, 120);
gradient.addColorStop(0, 'rgba(40, 25, 15, 0.35)');
gradient.addColorStop(0.4, 'rgba(60, 35, 20, 0.18)');
gradient.addColorStop(0.7, 'rgba(80, 45, 25, 0.06)');
gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
sctx.fillStyle = gradient;
sctx.fillRect(0, 0, 256, 256);

const shadowTex = new THREE.CanvasTexture(shadowCanvas);
const shadowGeo = new THREE.PlaneGeometry(2.4, 2.2);
const shadowMat = new THREE.MeshBasicMaterial({
  map: shadowTex,
  transparent: true,
  depthWrite: false
});
const softShadow = new THREE.Mesh(shadowGeo, shadowMat);
softShadow.rotation.x = -Math.PI / 2;
softShadow.position.set(0, 0.001, -0.05);
scene.add(softShadow);

// =========================================================================
// WASTE FLOW & COMPOST ANIMATION FROM MAIN-3D
// =========================================================================
// Active LED status light on the front panel
const led = new THREE.Mesh(new THREE.SphereGeometry(.016, 12, 12), new THREE.MeshBasicMaterial({ color: 0x2ecc71 }));
led.position.set(.15, 1.15, .155);
cab.add(led);

const flow = [];
const outQ = [];
const clock = new THREE.Clock();
let feeding = true; // Auto-feed on start for engaging visual appeal
let spawnT = 0;
let absorbed = 0;
let cin = 0;
let cout = 0;

const mat = (c, d) => new THREE.MeshStandardMaterial({ color: c, roughness: .75, side: d ? THREE.DoubleSide : THREE.FrontSide });
const part = (geo, c, sx, sy, sz, d) => {
  const m = new THREE.Mesh(geo, mat(c, d));
  m.scale.set(sx || 1, sy || 1, sz || 1);
  return m;
};

// 8 Varieties of organic waste models
const foods = [
  // Apple with stem
  () => {
    const g = new THREE.Group();
    g.add(part(new THREE.SphereGeometry(.035, 12, 10), 0xc0392b));
    const s = part(new THREE.CylinderGeometry(.003, .003, .02, 6), 0x5a3a1a);
    s.position.y = .038;
    g.add(s);
    return g;
  },
  // Banana crescent
  () => {
    const g = new THREE.Group();
    g.add(part(new THREE.TorusGeometry(.04, .011, 8, 14, Math.PI * .7), 0xf4d03f));
    return g;
  },
  // Bread slice
  () => {
    const g = new THREE.Group();
    g.add(part(new THREE.BoxGeometry(.07, .07, .018), 0xd8b070));
    return g;
  },
  // Carrot
  () => {
    const g = new THREE.Group();
    const c = part(new THREE.ConeGeometry(.016, .09, 8), 0xe67e22);
    c.rotation.z = Math.PI / 2;
    g.add(c);
    return g;
  },
  // Potato
  () => {
    const g = new THREE.Group();
    g.add(part(new THREE.SphereGeometry(.03, 12, 10), 0xa07850, 1.3, .9, 1));
    return g;
  },
  // Lettuce / cabbage leaf
  () => {
    const g = new THREE.Group();
    g.add(part(new THREE.SphereGeometry(.03, 12, 6), 0x6bb33a, 1.6, .12, 1.1, true));
    return g;
  },
  // Egg shell half
  () => {
    const g = new THREE.Group();
    g.add(part(new THREE.SphereGeometry(.03, 10, 8, 0, Math.PI * 2, 0, Math.PI / 2), 0xf5efe6, 1, 1, 1, true));
    return g;
  },
  // Citrus orange slice
  () => {
    const g = new THREE.Group();
    g.add(part(new THREE.CylinderGeometry(.035, .035, .012, 16), 0xf39c12));
    return g;
  }
];

const outGeo = new THREE.BoxGeometry(.04, .035, .04);

function rnd(a) { return a[Math.random() * a.length | 0]; }

function spawnIn() {
  const m = rnd(foods)();
  m.scale.setScalar(2.2);
  m.position.set((Math.random() - .5) * .34, H + .9, -.15 + (Math.random() - .5) * .26);
  m.userData = { k: 'in', vy: 0, sp: [Math.random() * 4, Math.random() * 4, Math.random() * 4] };
  cab.add(m);
  flow.push(m);
}

function spawnOut() {
  const m = new THREE.Mesh(outGeo, new THREE.MeshStandardMaterial({ color: 0x27ae60, roughness: .7 }));
  m.position.set((Math.random() - .5) * .08, .358, .17);
  m.rotation.x = .45;
  m.userData = { k: 'out', ph: 0, vz: .05, vy: 0, age: 0 };
  cab.add(m);
  flow.push(m);
}

function updateFlow() {
  const dt = Math.min(clock.getDelta(), .05);
  const now = clock.elapsedTime;
  const G = 2.5;

  if (feeding && target) {
    spawnT -= dt;
    if (spawnT <= 0) {
      spawnIn();
      spawnT = .24 + Math.random() * .18;
    }
  }

  while (outQ.length && outQ[0] <= now) {
    outQ.shift();
    spawnOut();
  }

  for (let i = flow.length - 1; i >= 0; i--) {
    const m = flow[i];
    const u = m.userData;
    let dead = false;

    if (u.k === 'in') {
      u.vy -= G * dt;
      m.position.y += u.vy * dt;
      m.rotation.x += u.sp[0] * dt;
      m.rotation.y += u.sp[1] * dt;
      m.rotation.z += u.sp[2] * dt;
      if (m.position.y < H) {
        const k = Math.max(m.scale.x - 9 * dt, 0);
        m.scale.setScalar(k);
        if (k < .12) {
          dead = true;
          cin++;
          absorbed++;
          if (absorbed % 2 === 0) outQ.push(now + 1.2);
        }
      }
    } else {
      if (u.ph === 0) {
        u.vz += .5 * dt;
        m.position.z += u.vz * dt;
        m.position.y = .358 - (m.position.z - .17) * .483;
        if (m.position.z > .33) u.ph = 1;
      } else if (u.ph === 1) {
        u.vy -= G * dt;
        m.position.z += u.vz * dt;
        m.position.y += u.vy * dt;
        m.rotation.x *= 1 - 3 * dt;
        if (m.position.y < .02) {
          m.position.y = .02;
          u.ph = 2;
        }
      } else {
        u.age += dt;
        if (u.age > 2.5) {
          const k = m.scale.x - 2 * dt;
          m.scale.setScalar(Math.max(k, 0));
          if (k <= 0) {
            dead = true;
            cout++;
          }
        }
      }
    }

    if (dead) {
      cab.remove(m);
      m.traverse(o => { if (o.material) o.material.dispose(); });
      flow.splice(i, 1);
    }
  }

  // Active digestion feedback
  led.material.color.setHex(feeding && target ? 0x2ecc71 : 0x4a4a4a);
  cab.rotation.z = feeding && target ? Math.sin(now * 70) * .0008 : 0;
  
  const cinEl = document.getElementById('cin');
  const coutEl = document.getElementById('cout');
  if (cinEl) cinEl.textContent = cin;
  if (coutEl) coutEl.textContent = cout;
}

// UI Controls
let target = -1.9; // Lid starts open to demonstrate the live digestion
let cur = 0;

const lidBtn = document.getElementById('lid');
const spinBtn = document.getElementById('spin');
const feedBtn = document.getElementById('feed');

const feedTxt = document.getElementById('feed-txt');
const feedMob = document.getElementById('feed-mob');
const lidTxt = document.getElementById('lid-txt');
const lidMob = document.getElementById('lid-mob');

function setLid(o) {
  target = o ? -1.9 : 0;
  lidBtn.setAttribute('aria-pressed', !!target);
  if (lidTxt) lidTxt.textContent = target ? 'Close Lid' : 'Open Lid';
  if (lidMob) lidMob.textContent = target ? 'Lid' : 'Open';
}

lidBtn.onclick = () => setLid(!target);

feedBtn.onclick = () => {
  feeding = !feeding;
  feedBtn.setAttribute('aria-pressed', feeding);
  if (feedTxt) feedTxt.textContent = feeding ? 'Stop Feeding' : 'Feed Waste';
  if (feedMob) feedMob.textContent = feeding ? 'Feed' : 'Start';
  if (feeding) setLid(true);
};

spinBtn.onclick = () => {
  controls.autoRotate = !controls.autoRotate;
  spinBtn.setAttribute('aria-pressed', controls.autoRotate);
};

document.getElementById('reset').onclick = () => {
  camera.position.copy(home);
  controls.target.set(0, 0.68, 0);
};

function size() {
  const w = host.clientWidth;
  const h = host.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', size);
size();

(function loop(){
  requestAnimationFrame(loop);
  cur += (target - cur) * 0.08;
  hinge.rotation.x = cur;
  updateFlow();
  controls.update();
  renderer.render(scene, camera);
})();
})();
</script>
</body>
</html>
